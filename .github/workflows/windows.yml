name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: meta
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run smoke checks
        run: npm test

      - name: Build portable Windows EXE
        run: npm run dist:win

      - name: Verify Windows EXE
        shell: pwsh
        run: |
          $exe = "dist/Atom-Shooter.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected Windows build not found: $exe"
          }

      - name: Publish single EXE release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $title = "Atom Shooter $tag"
          $exe = "dist/Atom-Shooter.exe"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Remove every previously uploaded custom asset so the release keeps
            # exactly one project asset: Atom-Shooter.exe.
            $assets = gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq '.assets[] | [.id, .name] | @tsv'
            foreach ($asset in $assets) {
              if ([string]::IsNullOrWhiteSpace($asset)) { continue }
              $parts = $asset -split "`t", 2
              $assetId = $parts[0]
              $assetName = $parts[1]
              Write-Host "Deleting old release asset: $assetName"
              gh api --method DELETE "repos/${{ github.repository }}/releases/assets/$assetId"
            }

            gh release upload $tag $exe --clobber
            gh release edit $tag --title $title --latest
          } else {
            gh release create $tag $exe --title $title --generate-notes --latest --target "${{ github.sha }}"
          }
